<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>TNT Media</title>
<style>body{background:#0a0a1a;color:#fff;font-family:Arial;padding:20px;text-align:center}
.btn{background:#6c3ce0;color:#fff;border:none;padding:15px 30px;border-radius:8px;cursor:pointer;margin:10px;font-size:16px}
.btn:hover{opacity:0.8}
.log{background:#000;padding:15px;border-radius:8px;text-align:left;font-family:monospace;max-height:200px;overflow-y:auto}
.card{background:rgba(255,255,255,0.05);padding:20px;border-radius:12px;margin:20px 0}
input{padding:10px;width:80%;background:rgba(255,255,255,0.1);border:1px solid #333;border-radius:6px;color:#fff;margin:10px 0}
</style>
</head>
<body>
<h1>🎬 TNT Media v3</h1>
<div class="card">
 <h3>🎵 Generate</h3>
 <input id="title" value="Nang Som Tren Vai">

 <button class="btn" onclick="generate()">🚀 Generate</button>
 <button class="btn" style="background:#00c853" onclick="gemini()">🤖 + AI</button>
 <button class="btn" style="background:#ff6b00" onclick="upload()">📤 Upload</button>
 <div id="result" style="margin-top:15px;color:#0f0"></div>
</div>
<div class="card">
 <h3>📋 Log</h3>
 <div class="log" id="log">[System] Ready</div>
</div>
<script>
const API = 'http://localhost:8001';
function log(msg){document.getElementById('log').innerHTML += '
['+new Date().toLocaleTimeString()+'] '+msg;}
async function call(endpoint,data){const r=await fetch(API+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});return r.json();}
async function generate(){log('Generating...');const r=await call('/api/generate',{song_title:document.getElementById('title').value});document.getElementById('result').innerHTML=JSON.stringify(r);log(r.success?'✅ Done':'❌ Failed');}
async function gemini(){log('Generating with Gemini...');const r=await call('/api/generate/gemini',{song_title:document.getElementById('title').value});document.getElementById('result').innerHTML=JSON.stringify(r);log(r.success?'✅ Done':'❌ Failed');}
async function upload(){log('Uploading...');const r=await call('/api/upload',{title:document.getElementById('title').value});document.getElementById('result').innerHTML=JSON.stringify(r);log(r.success?'✅ Uploaded':'❌ Failed');}
</script>
</body>
</html>
